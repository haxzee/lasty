[package]
name = "lasty-app"
version = "0.1.1"
description = "Local LaTeX editor with live PDF preview"
authors = ["stoegerer_simon"]
license = "MIT"
edition = "2024"

[lib]
name = "lasty_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
tempfile = "3.27.0"
tauri-plugin-dialog = "2"
flate2 = "1"
trash = "5"
spellbook = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
